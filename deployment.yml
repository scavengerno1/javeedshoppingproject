apiVersion: apps/v1
kind: Deployment
metadata:
  name: shopping-app
  labels:
    app: shopping-site
spec:
  replicas: 2
  selector:
    matchLabels:
      app: shopping-site
  template:
    metadata:
      labels:
        app: shopping-site
    spec:
      containers:
      - name: shopping-container
        image: scavengerno1/shopping-app:latest
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: shopping-service
spec:
  selector:
    app: shopping-site
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
  type: LoadBalancer
